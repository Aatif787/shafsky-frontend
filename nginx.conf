server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: enable gzip
    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/xml;
    gzip_min_length 256;
}
